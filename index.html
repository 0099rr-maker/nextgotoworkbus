<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CWB 巴士到站 Dashboard</title>
    <style>
        body { background-color: #121212; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; }
        h1 { text-align: center; color: #00E676; font-size: 2.2rem; }
        .bus-card { background: #1E1E1E; border-radius: 16px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border-left: 8px solid #FFD600; }
        .route { font-size: 3.5rem; font-weight: bold; width: 120px; }
        .route.kmb { color: #ED1C24; }
        .route.ctb { color: #FFD600; }
        .eta-container { text-align: right; }
        .eta-time { font-size: 2.5rem; font-weight: bold; color: #00E676; }
        .eta-next { font-size: 1.2rem; color: #AAAAAA; }
        .refresh-info { text-align: center; font-size: 0.9rem; color: #666; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>往 銅鑼灣 (CWB) 巴士到站時間</h1>
    <div id="dashboard">正在載入實時班次...</div>
    <div class="refresh-info" id="last-update">最後更新：--:--:--</div>

<script>
// 設定你上車的巴士路線與對應 API 設定
// 公司: 'KMB' 或 'CTB', stop: 巴士站ID, route: 路線號碼
const routesConfig = [
    { company: 'KMB', route: '108', stop: '001548', bound: 'O' }, 
    { company: 'KMB', route: '116', stop: '001550', bound: 'O' },
    { company: 'CTB', route: '107', stop: '002288', bound: 'I' } 
];

async function fetchETA() {
    const container = document.getElementById('dashboard');
    let htmlContent = '';

    for (const config of routesConfig) {
        let url = '';
        if (config.company === 'KMB') {
            url = `https://data.etabus.gov.hk/v1/transport/kmb/eta/${config.stop}/${config.route}/1`;
        } else {
            url = `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${config.stop}/${config.route}`;
        }

        try {
            const res = await fetch(url);
            const json = await res.json();
            const etas = json.data.filter(item => item.eta).slice(0, 2);

            let mainTime = '未有班次';
            let nextTime = '';

            if (etas.length > 0) {
                const now = new Date();
                const diff1 = Math.round((new Date(etas[0].eta) - now) / 60000);
                mainTime = diff1 <= 0 ? '即將到達' : `${diff1} 分鐘`;

                if (etas.length > 1) {
                    const diff2 = Math.round((new Date(etas[1].eta) - now) / 60000);
                    nextTime = `下班：${diff2} 分鐘`;
                }
            }

            htmlContent += `
                <div class="bus-card">
                    <div class="route ${config.company.toLowerCase()}">${config.route}</div>
                    <div class="eta-container">
                        <div class="eta-time">${mainTime}</div>
                        <div class="eta-next">${nextTime}</div>
                    </div>
                </div>
            `;
        } catch (e) {
            htmlContent += `<div class="bus-card"><div class="route">${config.route}</div><div>載入失敗</div></div>`;
        }
    }

    container.innerHTML = htmlContent;
    document.getElementById('last-update').innerText = '最後更新：' + new Date().toLocaleTimeString();
}

// 首次讀取 & 每 30 秒自動刷新
fetchETA();
setInterval(fetchETA, 30000);
</script>
</body>
</html>
