<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北拱街往 CWB 巴士到站 Dashboard</title>
    <style>
        body { background-color: #121212; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; }
        h1 { text-align: center; color: #00E676; font-size: 2rem; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #888888; font-size: 1rem; margin-bottom: 25px; }
        .bus-card { background: #1E1E1E; border-radius: 16px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border-left: 8px solid #00E676; }
        .route-box { display: flex; align-items: center; }
        .route { font-size: 3.5rem; font-weight: bold; width: 110px; color: #FFFFFF; }
        .eta-container { text-align: right; }
        .eta-time { font-size: 2.2rem; font-weight: bold; color: #00E676; }
        .eta-company { font-size: 1rem; padding: 2px 8px; border-radius: 4px; font-weight: bold; display: inline-block; margin-left: 6px; vertical-align: middle; }
        .kmb-tag { background-color: #ED1C24; color: white; }
        .ctb-tag { background-color: #FFD600; color: black; }
        .eta-sub-list { display: flex; justify-content: flex-end; gap: 12px; margin-top: 6px; font-size: 1.1rem; color: #BBBBBB; }
        .eta-sub-item { display: flex; align-items: center; }
        .eta-mini-tag { font-size: 0.75rem; padding: 1px 4px; border-radius: 3px; font-weight: bold; margin-left: 4px; }
        .refresh-info { text-align: center; font-size: 0.9rem; color: #666; margin-top: 25px; }
        #debug-box { background: #222; border: 1px dashed #555; padding: 15px; margin-top: 20px; font-size: 0.85rem; color: #FFD600; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>

<body>

    <h1>北拱街 往 港島/銅鑼灣</h1>
    <div class="subtitle">實時到站 Dashboard (診斷模式)</div>
    
    <div id="dashboard">正在載入實時班次...</div>
    <div class="refresh-info" id="last-update">最後更新：--:--:--</div>
    
    <!-- 診斷窗戶：用黎睇九巴 API 實際回傳左乜野 -->
    <div id="debug-box">正在連線九巴 API 取得原始資料...</div>

<script>
async function fetchETA() {
    const container = document.getElementById('dashboard');
    const debugBox = document.getElementById('debug-box');
    let htmlContent = '';
    const now = new Date();

    let kmbData = [];
    let rawKmbText = "";
    try {
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/001550`);
        const json = await res.json();
        if (json.data) {
            kmbData = json.data;
            // 找出所有 108, 116, 107 既資料畀你睇
            let matched = kmbData.filter(e => ['108', '116', '107'].includes(e.route));
            rawKmbText = "九巴 API 連線成功！找到相關路線筆數: " + matched.length + "\n" + JSON.stringify(matched, null, 2);
        } else {
            rawKmbText = "九巴 API 回傳結構異常: " + JSON.stringify(json);
        }
    } catch (err) {
        rawKmbText = "九巴 API 連線失敗: " + err.message;
    }

    debugBox.innerText = rawKmmText = rawKmbText;

    const busRoutes = [
        { route: '108', ctbStop: null, bound: 'O' },
        { route: '116', ctbStop: '001644', bound: 'O' },
        { route: '107', ctbStop: '001644', bound: 'I' }
    ];

    for (const item of busRoutes) {
        let allEtas = [];

        kmbData.forEach(e => {
            if (e.route === item.route && e.eta) {
                allEtas.push({ company: '九巴', time: new Date(e.eta) });
            }
        });

        if (item.ctbStop) {
            try {
                const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${item.ctbStop}/${item.route}`);
                const json = await res.json();
                if (json.data) {
                    json.data.forEach(e => {
                        if (e.eta && e.dir === item.bound) {
                            allEtas.push({ company: '城巴', time: new Date(e.eta) });
                        }
                    });
                }
            } catch (err) {}
        }

        allEtas.sort((a, b) => a.time - b.time);

        let mainTimeHtml = '未有班次';
        let subTimesHtml = '';

        if (allEtas.length > 0) {
            const diff1 = Math.round((allEtas[0].time - now) / 60000);
            const timeText1 = diff1 <= 0 ? '即將到達' : `${diff1} 分鐘`;
            const tagClass1 = allEtas[0].company === '九巴' ? 'kmb-tag' : 'ctb-tag';
            mainTimeHtml = `${timeText1} <span class="eta-company ${tagClass1}">${allEtas[0].company}</span>`;

            let subItems = [];
            for (let i = 1; i < Math.min(allEtas.length, 3); i++) {
                const diff = Math.round((allEtas[i].time - now) / 60000);
                const timeText = diff <= 0 ? '即將到' : `${diff}分`;
                const tagClass = allEtas[i].company === '九巴' ? 'kmb-tag' : 'ctb-tag';
                subItems.puts?.() || subItems.push(`
                    <div class="eta-sub-item">
                        下班: ${timeText} <span class="eta-mini-tag ${tagClass}">${allEtas[i].company}</span>
                    </div>
                `);
            }

            if (subItems.length > 0) {
                subTimesHtml = `<div class="eta-sub-list">${subItems.join('')}</div>`;
            }
        }

        htmlContent += `
            <div class="bus-card">
                <div class="route-box">
                    <div class="route">${item.route}</div>
                </div>
                <div class="eta-container">
                    <div class="eta-time">${mainTimeHtml}</div>
                    ${subTimesHtml}
                </div>
            </div>
        `;
    }

    container.innerHTML = htmlContent;
    document.getElementById('last-update').innerText = '最後更新：' + now.toLocaleTimeString();
}

fetchETA();
setInterval(fetchETA, 30000);
</script>
</body>
</html>
